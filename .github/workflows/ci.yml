name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python main.py example.sldz --check
      - run: python main.py presentations/slidez_deck/deck.sldz --check

  deck:
    # build the about-Slidez deck and attach it to the workflow run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python main.py presentations/slidez_deck/deck.sldz -o slidez-deck.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: slidez-deck
          path: slidez-deck.pdf
